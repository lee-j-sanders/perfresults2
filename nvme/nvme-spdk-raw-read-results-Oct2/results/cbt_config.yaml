benchmarks:
  rawfio:
    block_devices:
    - /dev/nvme8n1
    - /dev/nvme8n2
    - /dev/nvme8n3
    - /dev/nvme8n4
    - /dev/nvme9n1
    - /dev/nvme9n2
    - /dev/nvme9n3
    - /dev/nvme9n4
    - /dev/nvme10n1
    - /dev/nvme10n2
    - /dev/nvme10n3
    - /dev/nvme10n4
    - /dev/nvme11n1
    - /dev/nvme11n2
    - /dev/nvme11n3
    - /dev/nvme11n4
    - /dev/nvme12n1
    - /dev/nvme12n2
    - /dev/nvme12n3
    - /dev/nvme12n4
    - /dev/nvme13n1
    - /dev/nvme13n2
    - /dev/nvme13n3
    - /dev/nvme13n4
    - /dev/nvme14n1
    - /dev/nvme14n2
    - /dev/nvme14n3
    - /dev/nvme14n4
    - /dev/nvme15n1
    - /dev/nvme15n2
    - /dev/nvme15n3
    - /dev/nvme15n4
    client_ra: 128
    concurrent_procs: 32
    direct: 1
    fio_cmd: /usr/local/bin/fio
    iodepth:
    - 32
    - 48
    ioengine: libaio
    iterations: 1
    mode:
    - randread
    numjobs: 1
    op_size:
    - 4096
    osd_ra:
    - 4096
    ramp: 30
    time: 90
    vol_size: 100
cluster:
  archive_dir: /home/ljsanders/scripts/nvme/tmp
  clients:
  - soko07.front.sepia.ceph.com
  head: soko07.front.sepia.ceph.com
  iterations: 1
  osds:
  - soko07.front.sepia.ceph.com
  osds_per_node: 6
  pdsh_ssh_args: -a -x -l%u %h
  tmp_dir: /home/ljsanders/scripts/nvme/tmp
  use_existing: true
  user: root
monitoring_profiles:
  collectl:
    args: -c 18 -sCD -i 10 -P -oz -F0 --rawtoo --sep ";" -f {collectl_dir}
